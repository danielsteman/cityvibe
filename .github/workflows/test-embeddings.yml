name: Test Embeddings Generation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger

jobs:
  test-embeddings:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityvibe
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: |
          pip install torch sentence-transformers langchain-huggingface \
            sqlalchemy sqlmodel asyncpg psycopg2-binary \
            geoalchemy2 loguru pgvector alembic \
            --extra-index-url https://download.pytorch.org/whl/cpu
      
      - name: Install project dependencies
        run: |
          source $HOME/.cargo/env || true
          uv sync
      
      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cityvibe
          PYTHONPATH: packages/cityvibe-core/src
        run: |
          # Run alembic from project root where alembic.ini is located
          python -m alembic upgrade head
      
      - name: Test embedding generation (first 2 venues)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cityvibe
        run: |
          PYTHONPATH=packages/cityvibe-core/src:services/workers/src \
          python scripts/generate_embeddings.py 2
      
      - name: Verify embeddings in database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cityvibe -c \
            "SELECT COUNT(*) as total, COUNT(vibe_embedding) as with_embeddings FROM venue;"
      
      - name: Verify embedding dimensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d cityvibe -c \
            "SELECT name, CASE WHEN vibe_embedding IS NOT NULL THEN 'HAS EMBEDDING' ELSE 'NULL' END as status FROM venue LIMIT 5;"
