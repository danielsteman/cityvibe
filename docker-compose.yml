services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: cityvibe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cityvibe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityvibe-network

  redis:
    image: redis:7-alpine
    container_name: cityvibe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityvibe-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cityvibe-network:
    driver: bridge
