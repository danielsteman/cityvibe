services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: cityvibe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cityvibe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityvibe-network

  redis:
    image: redis:7-alpine
    container_name: cityvibe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cityvibe-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cityvibe-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cityvibe.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cityvibe-network

  embeddings:
    build:
      context: .
      dockerfile: Dockerfile.embeddings
    container_name: cityvibe-embeddings
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/cityvibe}
      DOCKER_ENV: "true"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./packages:/app/packages:ro
      - ./services/workers:/app/services/workers:ro
      - embeddings_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cityvibe-network
    profiles:
      - embeddings
    # Note: Threading issues may occur on macOS Docker Desktop
    # These workarounds help but may not fully resolve macOS limitations
    # Production (Linux) environments won't have these issues

  embeddings-api:
    build:
      context: .
      dockerfile: services/embeddings-api/Dockerfile
    container_name: cityvibe-embeddings-api
    ports:
      - "8001:8001"
    environment:
      DOCKER_ENV: "true"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PORT: "8001"
    volumes:
      - ./packages:/app/packages:ro
      - embeddings_cache:/root/.cache/huggingface
    networks:
      - cityvibe-network
    # macOS Docker Desktop workaround for pthread issues
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: cityvibe-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - cityvibe-network
    environment:
      # Limit memory usage - only keep 1 model loaded at a time
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Keep models in memory for shorter time
      OLLAMA_KEEP_ALIVE: "2m"
    # macOS Docker Desktop workaround for pthread issues
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    # Note: For better memory management, increase Docker Desktop memory allocation
    # Docker Desktop → Settings → Resources → Memory → Set to 4GB+
    # Note: Model will be pulled on first use, or manually with: docker exec cityvibe-ollama ollama pull llama3.1

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  embeddings_cache:
    driver: local
  ollama_data:
    driver: local

networks:
  cityvibe-network:
    driver: bridge
